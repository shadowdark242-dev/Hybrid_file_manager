name: Build APK

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: write

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: 21

            - uses: gradle/actions/setup-gradle@v4

            - name: Build debug APK
              run: ./gradlew assembleFossDebug --stacktrace

            - uses: actions/upload-artifact@v4
              with:
                  name: hybrid-file-manager-debug
                  path: app/build/outputs/apk/foss/debug/*.apk

            - name: Publish APK to the "latest" release
              if: github.ref == 'refs/heads/main'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  cp app/build/outputs/apk/foss/debug/*.apk HybridFileManager-debug.apk
                  gh release delete latest --cleanup-tag --yes || true
                  gh release create latest HybridFileManager-debug.apk \
                      --target "$GITHUB_SHA" \
                      --title "Latest build" \
                      --notes "Debug build of commit ${GITHUB_SHA::7}"

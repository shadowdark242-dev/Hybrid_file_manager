name: Build APK

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: write

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: 21

            - uses: gradle/actions/setup-gradle@v4

            # One permanent signing key kept in the Actions cache, so every build can update the previous one.
            - name: Restore signing key
              id: keystore-cache
              uses: actions/cache@v4
              with:
                  path: signing/hybrid.jks
                  key: signing-keystore-v1

            - name: Create signing key (first run only)
              if: steps.keystore-cache.outputs.cache-hit != 'true'
              run: |
                  mkdir -p signing
                  keytool -genkeypair -keystore signing/hybrid.jks -alias hybrid \
                      -keyalg RSA -keysize 2048 -validity 10000 \
                      -storepass hybrid-file-manager -keypass hybrid-file-manager \
                      -dname "CN=Hybrid File Manager"

            - name: Build release APK
              env:
                  SIGNING_KEY_ALIAS: hybrid
                  SIGNING_KEY_PASSWORD: hybrid-file-manager
                  SIGNING_STORE_FILE: ${{ github.workspace }}/signing/hybrid.jks
                  SIGNING_STORE_PASSWORD: hybrid-file-manager
              run: ./gradlew assembleFossRelease -PVERSION_CODE=$((100 + GITHUB_RUN_NUMBER)) --stacktrace

            - uses: actions/upload-artifact@v4
              with:
                  name: hybrid-file-manager
                  path: app/build/outputs/apk/foss/release/*.apk

            - name: Publish APK to the "latest" release
              if: github.ref == 'refs/heads/main'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  cp app/build/outputs/apk/foss/release/*.apk HybridFileManager.apk
                  gh release delete latest --cleanup-tag --yes || true
                  gh release create latest HybridFileManager.apk \
                      --target "$GITHUB_SHA" \
                      --title "Latest build" \
                      --notes "Build of commit ${GITHUB_SHA::7}"
